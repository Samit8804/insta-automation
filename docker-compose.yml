version: "3.8"

services:
  backend:
    build: ./backend
    container_name: instaflow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - JWT_SECRET=${JWT_SECRET:-instaflow_jwt_secret_change_in_production}
      - NODE_ENV=production
      - AUTOMATION_SERVICE_URL=http://automation:8000
    networks:
      - instaflow-net

  automation:
    build: ./automation
    container_name: instaflow-automation
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8000:8000"
    environment:
      - BACKEND_URL=http://backend:5000
      - API_TOKEN=${API_TOKEN:-}
      - BROWSER_HEADLESS=true
      - INSTAGRAM_USERNAME=${INSTAGRAM_USERNAME:-}
      - INSTAGRAM_PASSWORD=${INSTAGRAM_PASSWORD:-}
    volumes:
      - automation_screenshots:/app/screenshots
    networks:
      - instaflow-net

  frontend:
    build: ./frontend
    container_name: instaflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - instaflow-net

volumes:
  automation_screenshots:

networks:
  instaflow-net:
    driver: bridge
